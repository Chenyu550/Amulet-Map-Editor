name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-2025

    defaults:
      run:
        shell: bash

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller~=6.18 build

      - name: Build wheel
        shell: pwsh
        run: |
          $env:BDISTWHEELFREEZELIBS = "true"
          python -m build

      - name: Install wheel
        run: |
          python -m pip install dist/amulet_map_editor-*.whl --upgrade

      - name: Build EXE with PyInstaller
        run: |
          python -m PyInstaller -y --distpath ./installer/dist installer/Amulet.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v6
        with:
          name: Amulet-Windows-x64
          path: ./installer/dist/amulet
